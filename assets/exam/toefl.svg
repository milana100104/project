<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect width="640" height="400" fill="#f2f5fa"/>

  <!-- shared nautical-chart corner motif, same on every card -->
  <g fill="none" stroke="#0b1a38" stroke-opacity="0.07" stroke-width="1.4">
    <path d="M-20 400 A 300 300 0 0 1 280 100"/>
    <path d="M-20 360 A 260 260 0 0 1 240 100"/>
    <path d="M-20 320 A 220 220 0 0 1 200 100"/>
  </g>

  <!-- open book, hand-sketched: a faint retraced "ghost" pass under a crisp pass -->
  <g transform="translate(155,120) scale(4.6)">
    <g fill="none" stroke="#0b1a38" stroke-opacity=".22" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" transform="translate(.6,.5)">
      <path d="M24 14v25"/>
      <path d="M24 14c-4.4-3-11-3-16.4-.8v24c5.4-2 12-2 16.4.8"/>
      <path d="M24 14c4.4-3 11-3 16.4-.8v24c-5.4-2-12-2-16.4.8"/>
    </g>
    <g fill="none" stroke="#0b1a38" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 13.6v25.4"/>
      <path d="M24 13.6c-4.3-3-11-3-16.2-.9v24.3c5.3-2 11.9-2 16.2.9"/>
      <path d="M24 13.6c4.3-3 11-3 16.2-.9v24.3c-5.3-2-11.9-2-16.2.9"/>
      <path d="M11 17.5c3-1 6.4-1 9 .2" stroke-width=".7" opacity=".6"/>
      <path d="M11 22.4c3-1 6.4-1 9 .2" stroke-width=".7" opacity=".6"/>
    </g>
  </g>

  <!-- headphones resting above the book -->
  <g transform="translate(360,90) scale(3.6)" fill="none" stroke="#0b1a38" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 26v-4a14 14 0 0 1 27.5-3" stroke-opacity=".22" stroke-width="2.4" transform="translate(.5,.4)"/>
    <path d="M4 26v-4a14 14 0 0 1 27.5-3" stroke-width="1.5"/>
    <path d="M2 25.5c-1.6.3-2.5 1.6-2.5 4s.9 4.4 2.6 4.7" stroke-width="1.5"/>
    <path d="M33 18.5c1.6.3 2.5 1.6 2.5 4s-.9 4.4-2.6 4.7" stroke-width="1.5"/>
  </g>

  <!-- soundwave, listening -->
  <g stroke="#b0851b" stroke-width="3.4" stroke-linecap="round">
    <path d="M470 235v14"/>
    <path d="M484 225v34"/>
    <path d="M498 212v60"/>
    <path d="M512 228v28"/>
  </g>

  <!-- a couple of hand-set dots, adaptive/loading -->
  <g fill="#b0851b">
    <circle cx="205" cy="300" r="4.4"/>
    <circle cx="224" cy="302" r="4.4" opacity=".65"/>
    <circle cx="243" cy="299" r="4.4" opacity=".35"/>
  </g>
</svg>
