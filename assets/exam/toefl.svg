<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <radialGradient id="toeflGlow" cx="50%" cy="14%" r="80%">
      <stop offset="0" stop-color="#d4a72c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d4a72c" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardInk" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#f2f5fa"/>
  <rect width="640" height="400" fill="url(#toeflGlow)"/>

  <!-- shared nautical-chart corner motif, same on every card -->
  <g fill="none" stroke="#0b1a38" stroke-opacity="0.07" stroke-width="1.4">
    <path d="M-20 400 A 300 300 0 0 1 280 100"/>
    <path d="M-20 360 A 260 260 0 0 1 240 100"/>
    <path d="M-20 320 A 220 220 0 0 1 200 100"/>
  </g>

  <g filter="url(#cardInk)">
    <!-- laptop -->
    <path d="M175 292 L465 292 L490 316 L150 316 Z" fill="none" stroke="#0b1a38" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="275" y1="304" x2="365" y2="304" stroke="#0b1a38" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="205" y="112" width="230" height="180" rx="12" fill="none" stroke="#0b1a38" stroke-width="3.4"/>

    <!-- open book on screen -->
    <path d="M320 175v72" stroke="#0b1a38" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M320 175c-13-9-33-9-46-3v66c13-6 33-6 46 3" stroke="#0b1a38" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M320 175c13-9 33-9 46-3v66c-13-6-33-6-46 3" stroke="#0b1a38" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- soundwave, listening -->
    <g stroke="#b0851b" stroke-width="4.4" stroke-linecap="round">
      <line x1="386" y1="225" x2="386" y2="245"/>
      <line x1="398" y1="215" x2="398" y2="255"/>
      <line x1="410" y1="200" x2="410" y2="270"/>
    </g>

    <!-- adaptive dots -->
    <g fill="#b0851b">
      <circle cx="305" cy="330" r="4.6"/>
      <circle cx="325" cy="330" r="4.6" opacity=".6"/>
      <circle cx="345" cy="330" r="4.6" opacity=".3"/>
    </g>
  </g>
</svg>
