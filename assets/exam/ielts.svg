    <path d="M0 0 l22 6 -8 6 3 9 -8-4 -8 4 2-9 -9-6 z"/>
  </g>

  <!-- badge with checkmark, bottom-right -->
  <circle cx="440" cy="290" r="34" fill="#ffffff" stroke="#d4a72c" stroke-width="4"/>
  <path d="M425 291 l11 11 20-24" fill="none" stroke="#b0851b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
