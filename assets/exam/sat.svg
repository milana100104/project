<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect width="640" height="400" fill="#f2f5fa"/>

  <!-- shared nautical-chart corner motif, same on every card -->
  <g fill="none" stroke="#0b1a38" stroke-opacity="0.07" stroke-width="1.4">
    <path d="M-20 400 A 300 300 0 0 1 280 100"/>
    <path d="M-20 360 A 260 260 0 0 1 240 100"/>
    <path d="M-20 320 A 220 220 0 0 1 200 100"/>
  </g>

  <!-- graduation cap, hand-sketched -->
  <g transform="translate(215,90)">
    <g fill="none" stroke="#0b1a38" stroke-opacity=".22" stroke-width="2.2" stroke-linejoin="round" transform="translate(1.4,1)">
      <path d="M0 27 L72 0 L144 27 L72 54 Z"/>
      <path d="M36 41 L36 66 C36 78 108 78 108 66 L108 41"/>
    </g>
    <g fill="none" stroke="#0b1a38" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 27 L72 0 L144 27 L72 54 Z"/>
      <path d="M36 41 L36 66 C36 78 108 78 108 66 L108 41"/>
    </g>
    <path d="M144 27v34" stroke="#b0851b" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <circle cx="144" cy="65" r="4.6" fill="#b0851b"/>
  </g>

  <!-- rising score, one confident hand-drawn stroke -->
  <g fill="none" stroke="#0b1a38" stroke-width="1.4" stroke-linecap="round" opacity=".8">
    <path d="M178 322h270"/>
    <path d="M178 322v-140"/>
  </g>
  <path d="M195 300c34-6 55-30 78-56 25-28 55-48 92-58" fill="none" stroke="#b0851b" stroke-width="2" stroke-opacity=".22" stroke-linecap="round" transform="translate(1.3,1.2)"/>
  <path d="M195 300c34-6 55-30 78-56 25-28 55-48 92-58" fill="none" stroke="#b0851b" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M347 188l19-4 3 19" fill="none" stroke="#b0851b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- a few hand-set ticks along the baseline -->
  <g stroke="#0b1a38" stroke-width="1.4" opacity=".55">
    <path d="M220 322v8"/>
    <path d="M275 322v8"/>
    <path d="M330 322v8"/>
    <path d="M385 322v8"/>
  </g>
</svg>
