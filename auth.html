<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Beacon</title>
<link rel="icon" type="image/jpeg" href="assets/beacon-logo-icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=21">
<script src="assets/config.js?v=21" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/auth.js?v=21" defer></script>
</head>
<body>
<div class="grain"></div>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand"><span class="logo-mark" role="img" aria-label="Beacon"></span><span class="brand-name">Beacon</span></a>
    <nav class="main-nav"><a href="toefl.html">TOEFL</a><a href="ielts.html">IELTS</a><a href="sat.html">SAT</a><a href="webinars.html">Webinars</a></nav>
    <div class="header-actions">
      <a href="auth.html?view=login" class="link-quiet">Log in</a>
      <a href="auth.html?view=register" class="btn btn-gold">Start free</a>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="narrow" style="padding-top:56px">
      <div class="card" id="auth-card"></div>
      <p class="hand-note" style="display:block;text-align:center;margin-top:20px">reading &amp; listening are free — no card needed &#8599;</p>
    </section>
  </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var card = document.getElementById("auth-card");
  function qs(n){var m=new RegExp("[?&]"+n+"=([^&]*)").exec(location.search);return m?decodeURIComponent(m[1].replace(/\+/g," ")):null;}
  var view = qs("view") || "login";
  var next = qs("next") || "";

  function msg(node, ok, text){ node.className = "form-msg show " + (ok?"good":"bad"); node.textContent = text; }
  function afterLogin(){ location.href = next ? next : "index.html"; }
  function val(id){ var e=document.getElementById(id); return e?e.value:""; }
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function busy(btn,on){ btn.disabled=on; btn.textContent = on ? "…" : (btn.dataset.label||"Go"); }

  function render() {
    if (!window.BeaconAuth) { card.innerHTML = '<h1>Just a moment…</h1><p class="sub">Loading the sign-in service. If this stays, refresh the page.</p>'; setTimeout(render, 300); return; }
    if (view === "register") return renderRegister();
    if (view === "forgot") return renderForgot();
    if (view === "reset") return renderReset();
    return renderLogin();
  }

  function renderLogin() {
    card.innerHTML =
      '<h1>Welcome back</h1><p class="sub">Log in to keep your saved questions and progress.</p>' +
      (qs("confirmed") ? '<div class="form-msg good show">Email confirmed — you can log in now.</div>' : '') +
      '<div class="field"><label>Email or admin login</label><input id="id" type="text" autocomplete="username" placeholder="you@example.com"></div>' +
      '<div class="field"><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>' +
      '<button class="btn btn-gold full" id="go">Log in</button>' +
      '<div class="form-msg" id="m"></div>' +
      '<p class="form-switch"><a href="auth.html?view=forgot">Forgot password?</a></p>' +
      '<p class="form-switch">New here? <a href="auth.html?view=register">Create an account</a></p>';
    var go=document.getElementById("go"); go.dataset.label="Log in";
    go.onclick = function () {
      var m=document.getElementById("m"); busy(go,true);
      BeaconAuth.login(val("id"), val("pw")).then(function(r){
        busy(go,false);
        if (r.ok) return afterLogin();
        msg(m, false, r.error);
      });
    };
  }

  function renderRegister() {
    card.innerHTML =
      '<h1>Create your account</h1><p class="sub">Free to start — Reading and Listening, no card.</p>' +
      '<div class="field"><label>Name</label><input id="nm" type="text" autocomplete="name" placeholder="Your name"></div>' +
      '<div class="field"><label>Email</label><input id="em" type="email" autocomplete="email" placeholder="you@example.com"></div>' +
      '<div class="field"><label>Password</label><input id="pw" type="password" autocomplete="new-password" placeholder="At least 6 characters"><span class="hint">Minimum 6 characters.</span></div>' +
      '<button class="btn btn-gold full" id="go">Create account</button>' +
      '<div class="form-msg" id="m"></div>' +
      '<p class="form-switch">Already have an account? <a href="auth.html?view=login">Log in</a></p>';
    var go=document.getElementById("go"); go.dataset.label="Create account";
    go.onclick = function () {
      var m=document.getElementById("m"); busy(go,true);
      BeaconAuth.register(val("nm"), val("em"), val("pw")).then(function(r){
        busy(go,false);
        if (!r.ok) return msg(m, false, r.error);
        card.innerHTML = '<h1>Check your email</h1><p class="sub">We sent a confirmation link to <b>' + esc(val("em")) + '</b>. Open it to activate your account, then come back and log in.</p><a class="btn btn-gold full" href="auth.html?view=login">Back to log in</a>';
      });
    };
  }

  function renderForgot() {
    card.innerHTML =
      '<h1>Reset your password</h1><p class="sub">We’ll email you a link to set a new password.</p>' +
      '<div class="field"><label>Email</label><input id="em" type="email" placeholder="you@example.com"></div>' +
      '<button class="btn btn-gold full" id="go">Send reset link</button>' +
      '<div class="form-msg" id="m"></div>' +
      '<p class="form-switch"><a href="auth.html?view=login">Back to login</a></p>';
    var go=document.getElementById("go"); go.dataset.label="Send reset link";
    go.onclick = function () {
      var m=document.getElementById("m"); busy(go,true);
      BeaconAuth.resetRequest(val("em")).then(function(r){
        busy(go,false);
        if (r.ok) msg(m, true, "Done — check your inbox for the reset link.");
        else msg(m, false, r.error);
      });
    };
  }

  function renderReset() {
    card.innerHTML =
      '<h1>Set a new password</h1><p class="sub">Choose a new password for your account.</p>' +
      '<div class="field"><label>New password</label><input id="pw" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>' +
      '<button class="btn btn-gold full" id="go">Update password</button>' +
      '<div class="form-msg" id="m"></div>';
    var go=document.getElementById("go"); go.dataset.label="Update password";
    go.onclick = function () {
      var m=document.getElementById("m"); busy(go,true);
      BeaconAuth.setNewPassword(val("pw")).then(function(r){
        busy(go,false);
        if (r.ok){ msg(m, true, "Password updated — taking you to log in…"); setTimeout(function(){ location.href="auth.html?view=login"; }, 1200); }
        else msg(m, false, r.error);
      });
    };
  }

  render();
});
</script>
</body>
</html>
