<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Beacon</title>
<link rel="icon" type="image/jpeg" href="assets/beacon-logo-icon.jpg?v=142">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=142">
<script src="assets/config.js?v=142" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/auth.js?v=142" defer></script>
<script src="assets/chat.js?v=142" defer></script>
</head>
<body>
<div class="grain"></div>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand"><span class="logo-mark" role="img" aria-label="Beacon"></span><span class="brand-name">Beacon</span></a>
    <nav class="main-nav"><a href="index.html">Home</a><a href="toefl.html">TOEFL</a><a href="ielts.html">IELTS</a><a href="sat.html">SAT</a><a href="webinars.html">Webinars</a></nav>
    <div class="header-actions">
      <a href="auth.html?view=login" class="link-quiet">Log in</a>
      <a href="auth.html?view=register" class="btn btn-gold">Start free</a>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <section class="narrow" style="padding-top:56px">
      <div class="card" id="auth-card"></div>
      <p class="hand-note" style="display:block;text-align:center;margin-top:20px">reading <span class="amp">&amp;</span> listening are free - no card needed &#8599;</p>
    </section>
  </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var card = document.getElementById("auth-card");
  function qs(n){var m=new RegExp("[?&]"+n+"=([^&]*)").exec(location.search);return m?decodeURIComponent(m[1].replace(/\+/g," ")):null;}
  var view = qs("view") || "login";
  var next = qs("next") || "";

  function msg(node, ok, text){ node.className = "form-msg show " + (ok?"good":"bad"); node.textContent = text; }
  function afterLogin(){ location.href = next ? next : "index.html"; }
  function val(id){ var e=document.getElementById(id); return e?e.value:""; }
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function busy(btn,on){ btn.disabled=on; btn.innerHTML = on ? "…" : (btn.dataset.label||"Go"); }

  var GOOGLE_G = '<svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>';
  function googleBlock(label){
    return '<button type="button" class="btn btn-google full" id="goog">' + GOOGLE_G + '<span>' + label + '</span></button>' +
           '<div class="auth-or"><span>or</span></div>';
  }
  function goalRow(id,name,hint){
    return '<div class="goal-row"><label class="goal-check"><input type="checkbox" id="g-'+id+'"> '+name+'</label>' +
      '<input class="goal-target" id="gt-'+id+'" inputmode="decimal" placeholder="'+hint+'"></div>';
  }
  function collectGoals(){
    var out={}; ["toefl","ielts","sat"].forEach(function(id){
      var c=document.getElementById("g-"+id);
      if (c && c.checked){ var t=parseFloat((document.getElementById("gt-"+id)||{}).value); out[id]=isNaN(t)?{}:{target:t}; }
    });
    return out;
  }
  function wireGoogle(){
    var g = document.getElementById("goog"); if (!g) return;
    g.onclick = function(){
      g.disabled = true;
      BeaconAuth.oauth("google").then(function(r){
        if (!r.ok){ g.disabled = false; var m=document.getElementById("m"); if (m) msg(m, false, r.error); }
        // on success the browser redirects to Google, nothing else to do here
      });
    };
  }

  function render() {
    if (!window.BeaconAuth) { card.innerHTML = '<h1>Just a moment…</h1><p class="sub">Loading the sign-in service. If this stays, refresh the page.</p>'; setTimeout(render, 300); return; }
    if (view === "register") return renderRegister();
    if (view === "verify") return renderVerify(qs("email") || "");
    if (view === "forgot") return renderForgot();
    if (view === "reset") return renderReset();
    return renderLogin();
  }

  function renderLogin() {
    card.innerHTML =
      '<h1>Welcome back</h1><p class="sub">Log in to keep your saved questions and progress.</p>' +
      (qs("confirmed") ? '<div class="form-msg good show">Email confirmed - you can log in now.</div>' : '') +
      googleBlock("Continue with Google") +
      '<div class="field"><label>Email or admin login</label><input id="id" type="text" autocomplete="username" placeholder="you@example.com"></div>' +
      '<div class="field"><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>' +
      '<button class="btn btn-gold full" id="go">Log in</button>' +
      '<div class="form-msg" id="m"></div>' +
      '<p class="form-switch"><a href="auth.html?view=forgot">Forgot password?</a></p>' +
      '<p class="form-switch">New here? <a href="auth.html?view=register">Create an account</a></p>';
    var go=document.getElementById("go"); go.dataset.label="Log in";
    go.onclick = function () {
      var m=document.getElementById("m"); busy(go,true);
      BeaconAuth.login(val("id"), val("pw")).then(function(r){
        busy(go,false);
        if (r.ok) return afterLogin();
        if (r.needVerify) { location.href = "auth.html?view=verify&email=" + encodeURIComponent(val("id")); return; }
        msg(m, false, r.error);
      });
    };
    wireGoogle();
  }

  function renderRegister() {
    card.innerHTML =
      '<h1>Create your account</h1><p class="sub">Free to start - Reading and Listening, no card.</p>' +
      googleBlock("Sign up with Google") +
      '<div class="field"><label>Name</label><input id="nm" type="text" autocomplete="name" placeholder="Your name"></div>' +
      '<div class="field"><label>Nickname <span class="hint">shown in the chat - must be unique</span></label><input id="nick" type="text" autocomplete="off" placeholder="e.g. star_reader" maxlength="20"><span class="hint" id="nickmsg"></span></div>' +
      '<div class="field"><label>Email</label><input id="em" type="email" autocomplete="email" placeholder="you@example.com"></div>' +
      '<div class="field"><label>Password</label><input id="pw" type="password" autocomplete="new-password" placeholder="At least 6 characters"><span class="hint">Minimum 6 characters.</span></div>' +
      '<div class="goal-block"><label class="goal-title">Which exams are you preparing for? <span class="hint">tick any, add a target score</span></label>' +
        goalRow("toefl","TOEFL","target /120, e.g. 100") +
        goalRow("ielts","IELTS","target band, e.g. 7.0") +
        goalRow("sat","SAT","target /1600, e.g. 1400") +
      '</div>' +
      '<button class="btn btn-gold full" id="go">Create account</button>' +
      '<div class="form-msg" id="m"></div>' +
      '<p class="form-switch">Already have an account? <a href="auth.html?view=login">Log in</a></p>';
    var go=document.getElementById("go"); go.dataset.label="Create account";
    var nickInput=document.getElementById("nick");
    if (nickInput) nickInput.addEventListener("blur", function(){
      var v=nickInput.value.trim(), nm=document.getElementById("nickmsg");
      if (!v){ nm.textContent=""; return; }
      if (window.sb) sb.from("profiles").select("user_id").eq("nickname", v).maybeSingle().then(function(r){
        if (r && r.data){ nm.textContent="that nickname is taken - try another"; nm.style.color="#ef7d7d"; }
        else { nm.textContent="available ✓"; nm.style.color="#4bcf94"; }
      });
    });
    go.onclick = function () {
      var m=document.getElementById("m"); busy(go,true);
      BeaconAuth.register(val("nm"), val("em"), val("pw"), collectGoals(), val("nick")).then(function(r){
        busy(go,false);
        if (!r.ok) return msg(m, false, r.error);
        renderVerify(val("em"));
      });
    };
    wireGoogle();
  }

  function renderVerify(email) {
    card.innerHTML =
      '<h1>Enter your code</h1><p class="sub">We emailed a 6-digit code to activate your account. Enter it below. <span class="hint">Check the spam folder if you don’t see it.</span></p>' +
      '<div class="field"><label>Email</label><input id="vem" type="email" autocomplete="email" placeholder="you@example.com" value="' + esc(email) + '"></div>' +
      '<div class="field"><label>Code from the email</label><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" maxlength="8"></div>' +
      '<button class="btn btn-gold full" id="vgo">Verify <span class="amp">&amp;</span> sign in</button>' +
      '<div class="form-msg" id="m"></div>' +
      '<p class="form-switch"><a href="#" id="resend">Didn’t get it? Resend the code</a></p>' +
      '<p class="form-switch">Already verified? <a href="auth.html?view=login">Log in</a></p>';
    var vgo = document.getElementById("vgo"); vgo.dataset.label = 'Verify <span class="amp">&amp;</span> sign in';
    vgo.onclick = function () {
      var m = document.getElementById("m"); busy(vgo, true);
      BeaconAuth.verifyCode(val("vem"), val("code")).then(function (r) {
        busy(vgo, false);
        if (!r.ok) return msg(m, false, r.error);
        msg(m, true, "Verified - signing you in…");
        setTimeout(function () { location.href = "index.html"; }, 800);
      });
    };
    document.getElementById("resend").onclick = function (e) {
      e.preventDefault();
      var m = document.getElementById("m");
      BeaconAuth.resendCode(val("vem")).then(function (r) {
        if (r.ok) msg(m, true, "Sent - check your inbox (and spam).");
        else msg(m, false, r.error);
      });
    };
  }

  function renderForgot() {
    card.innerHTML =
      '<h1>Reset your password</h1><p class="sub">We’ll email you a link to set a new password.</p>' +
      '<div class="field"><label>Email</label><input id="em" type="email" placeholder="you@example.com"></div>' +
      '<button class="btn btn-gold full" id="go">Send reset link</button>' +
      '<div class="form-msg" id="m"></div>' +
      '<p class="form-switch"><a href="auth.html?view=login">Back to login</a></p>';
    var go=document.getElementById("go"); go.dataset.label="Send reset link";
    go.onclick = function () {
      var m=document.getElementById("m"); busy(go,true);
      BeaconAuth.resetRequest(val("em")).then(function(r){
        busy(go,false);
        if (r.ok) msg(m, true, "Done - check your inbox for the reset link.");
        else msg(m, false, r.error);
      });
    };
  }

  function renderReset() {
    card.innerHTML =
      '<h1>Set a new password</h1><p class="sub">Choose a new password for your account.</p>' +
      '<div class="field"><label>New password</label><input id="pw" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>' +
      '<button class="btn btn-gold full" id="go">Update password</button>' +
      '<div class="form-msg" id="m"></div>';
    var go=document.getElementById("go"); go.dataset.label="Update password";
    go.onclick = function () {
      var m=document.getElementById("m"); busy(go,true);
      BeaconAuth.setNewPassword(val("pw")).then(function(r){
        busy(go,false);
        if (r.ok){ msg(m, true, "Password updated - taking you to log in…"); setTimeout(function(){ location.href="auth.html?view=login"; }, 1200); }
        else msg(m, false, r.error);
      });
    };
  }

  render();
});
</script>
</body>
</html>
