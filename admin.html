<style>
/* ---- Admin: clean white workspace ---- */
body.adm-body{background:#eef1f7;font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;}
body.adm-body .grain,body.adm-body #beacon-grain{display:none!important;}
/* keep the top bar (logo + brand) light on its navy background */
body.adm-body .site-header .brand-name,body.adm-body .site-header .main-nav a,body.adm-body .site-header .link-quiet{color:#f4efe3;}
.adm-wrap{max-width:920px;margin:0 auto;padding:26px 20px 80px;color:#16233d;}
.adm-title{font-size:1.7rem;font-weight:700;color:#14233f;margin:6px 0 2px;}
.adm-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:#8a97b0;letter-spacing:.02em;}
.adm-nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 24px;}
.adm-nav a{padding:9px 16px;border-radius:10px;background:#fff;border:1px solid #dfe4ee;color:#41506e;font-weight:600;font-size:.92rem;text-decoration:none;transition:.15s;}
.adm-nav a:hover{border-color:#c8b268;color:#14233f;}
.adm-nav a.active{background:#14233f;border-color:#14233f;color:#fff;}
.adm-card{background:#fff;border:1px solid #e2e7f0;border-radius:16px;padding:26px;box-shadow:0 6px 22px rgba(20,40,80,.06);margin-bottom:22px;}
.adm-h{font-size:1.2rem;font-weight:700;margin:0 0 4px;color:#14233f;}
.adm-sub{color:#5a6b8c;font-size:.9rem;margin:0 0 20px;line-height:1.45;}
.adm-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:640px){.adm-grid3{grid-template-columns:1fr;}}
.adm-field{margin-bottom:16px;}
.adm-field>label{display:block;font-weight:600;font-size:.82rem;color:#33415f;margin-bottom:6px;}
.adm-field .hint{color:#93a0b8;font-weight:400;}
.adm-input,.adm-textarea,.adm-select{width:100%;box-sizing:border-box;background:#fff;border:1px solid #c9d2e2;border-radius:10px;padding:10px 12px;font-size:.95rem;color:#14233f;font-family:inherit;}
.adm-input[type=file]{padding:8px 10px;background:#f7f9fc;}
.adm-input:focus,.adm-textarea:focus,.adm-select:focus{outline:none;border-color:#d4a72c;box-shadow:0 0 0 3px rgba(212,167,44,.16);}
.adm-textarea{min-height:82px;resize:vertical;line-height:1.5;}
.adm-row{display:flex;gap:10px;align-items:center;margin-bottom:9px;}
.adm-radio{width:18px;height:18px;flex-shrink:0;accent-color:#d4a72c;cursor:pointer;}
.adm-choice-in{flex:1;}
.adm-x{background:#fff;border:1px solid #e3c3c3;color:#c23b3b;border-radius:8px;width:34px;height:38px;flex-shrink:0;cursor:pointer;font-size:.85rem;}
.adm-x:hover{background:#fdecec;}
.adm-note{font-size:.82rem;color:#6b7a97;margin:2px 0 14px;line-height:1.5;}
.adm-note code{background:#eef1f7;border:1px solid #dbe1ec;border-radius:5px;padding:1px 6px;font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:#14233f;}
.adm-typenote{background:#fff8e6;border:1px solid #f0dfa8;border-radius:10px;padding:10px 13px;font-size:.85rem;color:#6d5a1e;margin-bottom:16px;line-height:1.5;}
.adm-prev{background:#f4f7fc;border:1px solid #dbe3f0;border-radius:10px;padding:12px 14px;margin:2px 0 14px;font-size:.9rem;line-height:1.6;}
.adm-prev-line{margin:2px 0;color:#33415f;}
.adm-prev-line b{color:#14233f;}
.adm-prev u{color:#b0851b;text-decoration:none;border-bottom:2px solid #d4a72c;padding:0 3px;font-weight:600;}
.adm-prev-empty{color:#8a97b0;}
.adm-btn{background:#d4a72c;color:#20180a;border:none;border-radius:11px;padding:13px 18px;font-weight:700;font-size:.98rem;cursor:pointer;width:100%;transition:background .15s;}
.adm-btn:hover{background:#e0bc4f;}
.adm-btn:disabled{opacity:.55;cursor:not-allowed;}
.adm-btn.sec{background:#eef1f7;color:#33415f;border:1px solid #cdd5e4;width:auto;padding:8px 14px;font-size:.85rem;font-weight:600;margin-top:2px;}
.adm-btn.sec:hover{background:#e3e8f2;}
.adm-msg{margin-top:12px;font-size:.9rem;min-height:1.1em;font-weight:600;}
.adm-msg.good{color:#1a8f5a;}.adm-msg.bad{color:#c23b3b;}
.adm-listtitle{font-size:1rem;font-weight:700;color:#3a496a;margin:26px 0 12px;}
.adm-item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #e2e7f0;border-radius:12px;padding:12px 15px;margin-bottom:8px;}
.adm-item-main{flex:1;min-width:0;}
.adm-item-main b{color:#14233f;font-size:.92rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.adm-item-main span{color:#7382a0;font-size:.78rem;text-transform:capitalize;}
.adm-del{background:#fff;border:1px solid #e3b3b3;color:#c23b3b;border-radius:9px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:.82rem;flex-shrink:0;}
.adm-del:hover{background:#fdecec;}
.adm-item.is-contacted{background:#f5f8f4;}
.adm-item.is-contacted .adm-item-main b{color:#5c6b8a;}
.adm-check{display:flex;align-items:center;gap:6px;font-size:.78rem;color:#4a5875;flex-shrink:0;cursor:pointer;user-select:none;white-space:nowrap;}
.adm-check input{width:16px;height:16px;accent-color:#2e8b57;cursor:pointer;}
.adm-empty{color:#8a97b0;font-size:.9rem;padding:16px;text-align:center;background:#fff;border:1px dashed #d5dceb;border-radius:12px;}
.adm-denied{background:#fff;border:1px solid #e2e7f0;border-radius:16px;padding:40px;text-align:center;color:#5a6b8c;}
/* passage-set block editor */
.adm-pblock{border:1px solid #dbe3f0;border-left:3px solid #d4a72c;border-radius:12px;padding:16px;margin-bottom:14px;background:#fafbfe;}
.adm-prow{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.adm-birow{margin-bottom:8px;}
.adm-mcq{border:1px dashed #d5dceb;border-radius:10px;padding:12px;margin-bottom:10px;background:#fff;}
.adm-mcq>.adm-input{margin-bottom:8px;}
.adm-mcopts .adm-row{margin-bottom:6px;}
.adm-mcq [data-irm]{margin-top:4px;color:#c23b3b;border-color:#e3c3c3;}
</style>
</head>

      <a href="admin.html?tab=toefl" data-tab="toefl">TOEFL</a>

<script>
document.addEventListener("DOMContentLoaded", function () {
  BeaconAuth.requireAuth().then(function (user) {
    if (!user) return;
    var panel = document.getElementById("panel");
    if (user.role !== "admin") {
      panel.innerHTML = '<div class="adm-denied">Admin only. Sign in with an admin account.</div>';
      return;
    }

    function qs(n){ var m=new RegExp("[?&]"+n+"=([^&]*)").exec(location.search); return m?decodeURIComponent(m[1]):null; }
    function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
    function shorten(s){ s=String(s||""); return s.length>76 ? s.slice(0,76)+"…" : s; }
    function field(label, inner){ return '<div class="adm-field"><label>'+label+'</label>'+inner+'</div>'; }
    function val(id){ var e=document.getElementById(id); return e ? String(e.value||"").trim() : ""; }
    function fileOf(id){ var e=document.getElementById(id); return e && e.files && e.files[0]; }

    // Each exam → sections → question types, with the answer FORMAT and per-section rules.
    // fmt: 'choice' (options), 'cloze' (fill missing letters), 'text' (typed answer).
    var EXAMS = {
      toefl: { label:"TOEFL", skills:{
        reading:  { label:"Reading", passage:true, types:{
          "complete-the-words":{ label:"Complete the Words", fmt:"cloze" },
          "daily-life":{ label:"Read in Daily Life", fmt:"choice" },
          "whole-text":{ label:"Academic Passage", fmt:"choice" } }},
        listening:{ label:"Listening", audio:true, image:true, transcript:true, types:{
          "best-response":{ label:"Best response", fmt:"choice" },
          "dialogues":{ label:"Short dialogues", fmt:"choice" },
          "lectures":{ label:"Lectures & announcements", fmt:"choice" } }}
      }},
      ielts: { label:"IELTS", skills:{
        reading:  { label:"Reading", passage:true, types:{
          "full-passage":{ label:"Full passage (mixed question types)", fmt:"passage" } }},
        listening:{ label:"Listening", audio:true, image:true, transcript:true, types:{
          "multiple-choice":{ label:"Multiple choice", fmt:"choice" },
          "form-completion":{ label:"Form / note / table completion", fmt:"completion", note:"Add each line with a gap (e.g. “Name: ______”) and its answer." },
          "matching":{ label:"Matching", fmt:"matching", note:"Options = the choices they match to. Each item is a person/thing; type which option it matches." },
          "plan-map-diagram-labelling":{ label:"Plan / map / diagram labelling", fmt:"choice", note:"Upload the map/plan image below. Prompt: which label. Options are the letters/places; tick the correct one." },
          "sentence-completion":{ label:"Sentence completion", fmt:"completion", note:"Add each sentence with a gap and its answer." },
          "short-answer":{ label:"Short-answer questions", fmt:"completion", note:"Add each question and its short answer." } }}
      }},
      sat: { label:"SAT", skills:{
        math:    { label:"Math", image:true, types:{
          "algebra":{ label:"Algebra", fmt:"choice" },
          "advanced-math":{ label:"Advanced Math", fmt:"choice" },
          "problem-solving-data-analysis":{ label:"Problem-Solving & Data Analysis", fmt:"choice" },
          "geometry-trig":{ label:"Geometry & Trigonometry", fmt:"choice" } }},
        english: { label:"Reading & Writing", passage:true, types:{
          "information-ideas":{ label:"Information & Ideas", fmt:"choice" },
          "craft-structure":{ label:"Craft & Structure", fmt:"choice" },
          "expression-ideas":{ label:"Expression of Ideas", fmt:"choice" },
          "standard-conventions":{ label:"Standard English Conventions", fmt:"choice" } }}
      }}
    };

    var tab = qs("tab") || "toefl";
    document.querySelectorAll("#tabs a").forEach(function (a){ if (a.dataset.tab === tab) a.classList.add("active"); });

    if (tab === "webinars") { renderWebinars(); return; }
    if (tab === "mentors") { renderMentors(); return; }
    if (!EXAMS[tab]) { renderExam("toefl"); return; }
    BeaconStore.ready().then(function () { renderExam(tab); });

    /* =================== questions, per exam =================== */
    function renderExam(ex) {
      var conf = EXAMS[ex];
      var skillKeys = Object.keys(conf.skills);
      panel.innerHTML =
        '<div class="adm-card">' +
          '<h2 class="adm-h">Add a ' + esc(conf.label) + ' question</h2>' +
          '<p class="adm-sub">Choose the section and type - the form below adapts to how that question is answered, and each one is checked by its own rules.</p>' +
          '<div class="adm-grid3">' +
            '<div class="adm-field"><label>Section</label><select class="adm-select" id="a-skill">' +
              skillKeys.map(function (s){ return '<option value="'+s+'">'+esc(conf.skills[s].label)+'</option>'; }).join("") + '</select></div>' +
            '<div class="adm-field"><label>Type</label><select class="adm-select" id="a-type"></select></div>' +
            '<div class="adm-field"><label>Difficulty</label><select class="adm-select" id="a-diff"><option>easy</option><option selected>medium</option><option>hard</option></select></div>' +
          '</div>' +
          '<div id="a-dyn"></div>' +
          '<button class="adm-btn" id="a-add">Add question</button>' +
          '<div class="adm-msg" id="a-msg"></div>' +
        '</div>' +
        '<h3 class="adm-listtitle">' + esc(conf.label) + ' questions</h3>' +
        '<div class="adm-list" id="a-list"></div>';

      var skillSel = document.getElementById("a-skill");
      var typeSel  = document.getElementById("a-type");
      skillSel.onchange = function(){ fillTypes(); };
      typeSel.onchange  = function(){ buildDyn(); };
      fillTypes();
      document.getElementById("a-add").onclick = onAdd;
      listQ();

      function curSkill(){ return conf.skills[skillSel.value]; }
      function curType(){ return curSkill().types[typeSel.value]; }
      function setMsg(t, kind){ var m=document.getElementById("a-msg"); m.className="adm-msg"+(kind?" "+kind:""); m.textContent=t||""; }
      function err(t){ setMsg(t,"bad"); return null; }

      function fillTypes(){
        var sk = curSkill();
        var tk = Object.keys(sk.types);
        typeSel.innerHTML = tk.map(function (t){ return '<option value="'+t+'">'+esc(sk.types[t].label)+'</option>'; }).join("");
        buildDyn();
      }

      /* ---- dynamic, type-specific fields ---- */
      function buildDyn(){
        var sk = curSkill(), t = curType(), h = "";
        if (t.note) h += '<div class="adm-typenote">' + t.note + '</div>';
        // 0a) Part (IELTS Listening only) - which of the 4 official parts this belongs to;
        // students see the site grouped by part, not by answer format.
        if (ex === "ielts" && skillSel.value === "listening") {
          h += field('Part <span class="hint">- which section of the real IELTS Listening test</span>',
            '<select class="adm-select" id="a-part">' +
              '<option value="1">Part 1 - two people, everyday conversation</option>' +
              '<option value="2">Part 2 - one person, everyday monologue</option>' +
              '<option value="3">Part 3 - up to 4 people, education context (opinions matter)</option>' +
              '<option value="4">Part 4 - one person, academic lecture</option>' +
            '</select>');
        }
        // 0) title (full reading passages only) - shown on the test card and above the text
        if (t.fmt === "passage") h += field('Passage title <span class="hint">(shown on the test card - e.g. The Honey Bee)</span>', '<input class="adm-input" id="d-title" placeholder="The Honey Bee">');
        // 1) the question
        h += field('Question' + (t.fmt==="cloze" ? ' <span class="hint">(instruction line shown above the words)</span>' : ''),
                   '<input class="adm-input" id="d-prompt" placeholder="' + (t.fmt==="cloze" ? "e.g. Complete the missing letters to finish each word." : "The question the student answers") + '">');
        // 1b) TOEFL "Read in Daily Life" - format the text as an email / notice / message
        if (typeSel.value === "daily-life") {
          h += field('Format <span class="hint">- how this text is presented, TOEFL-style</span>',
            '<select class="adm-select" id="d-letterkind">' +
              '<option value="">Plain text</option>' +
              '<option value="email">Email</option>' +
              '<option value="announcement">Announcement / notice</option>' +
              '<option value="message">Text message</option>' +
            '</select>');
          h += field('From / sender <span class="hint">(optional - shown above the text)</span>', '<input class="adm-input" id="d-letterfrom" placeholder="e.g. Prof. Alvarez">');
          h += field('Subject / title <span class="hint">(optional - Email subject, or the Announcement heading)</span>', '<input class="adm-input" id="d-lettersubject" placeholder="e.g. Room change for Thursday\'s seminar">');
        }
        // 2) the text
        if (sk.passage) h += field('Reading text / passage <span class="hint">(optional - the text the questions are based on)</span>', '<textarea class="adm-textarea" id="d-passage"></textarea>');
        if (sk.image)   h += field('Image <span class="hint">(optional - graph, map or diagram)</span>', '<input class="adm-input" type="file" id="d-image" accept="image/*">');
        if (sk.audio)   h += field('Audio file <span class="hint">(upload the listening clip - mp3 / m4a)</span>', '<input class="adm-input" type="file" id="d-audio" accept="audio/*">');
        // 3) the answers
        if (t.fmt === "cloze")          h += clozeEditor();
        else if (t.fmt === "passage")   h += passageEditor();
        else if (t.fmt === "matching")  h += matchingEditor();
        else if (t.fmt === "completion")h += completionEditor();
        else if (t.fmt === "text")      h += textEditor(t);
        else                            h += choiceEditor(t.fixed);

        if (sk.transcript) h += field('Transcript <span class="hint">(optional, revealed after answering)</span>', '<textarea class="adm-textarea" id="d-transcript"></textarea>');
        h += field('Explanation <span class="hint">(optional, shown after answering)</span>', '<textarea class="adm-textarea" id="d-exp"></textarea>');

        document.getElementById("a-dyn").innerHTML = h;
        var p0 = document.getElementById("d-prompt");
        if (p0 && !p0.value) {
          if (t.fmt === "cloze") p0.value = "Complete the missing letters to finish each word.";
          else if (typeSel.value === "matching-headings") p0.value = "Choose the correct heading for each paragraph.";
          else if (typeSel.value === "matching-information") p0.value = "Which paragraph contains the following information?";
          else if (t.fmt === "completion") p0.value = "Complete each sentence with a word from the text.";
        }
        wireEditor(t);
        setMsg("");
      }

      function choiceEditor(fixed){
        return '<div class="adm-field"><label>Answer options <span class="hint">- tick the correct one</span></label>' +
          '<div id="d-choices">' + choiceRows(fixed) + '</div>' +
          (fixed ? "" : '<button type="button" class="adm-btn sec" id="d-addopt">+ Add option</button>') +
          '</div>';
      }
      function choiceRows(fixed){
        if (fixed) return fixed.map(function (o,i){ return choiceRow(o, true, i===0); }).join("");
        var out=""; for (var i=0;i<4;i++) out += choiceRow("", false, i===0); return out;
      }
      function choiceRow(text, ro, checked){
        return '<div class="adm-row">' +
          '<input type="radio" name="d-correct" class="adm-radio"' + (checked?" checked":"") + '>' +
          '<input class="adm-input adm-choice-in" data-choice value="' + esc(text) + '"' + (ro?" readonly":"") + ' placeholder="Answer option">' +
          (ro ? "" : '<button type="button" class="adm-x" title="Remove option">✕</button>') +
          '</div>';
      }
      function textEditor(){
        return field('Correct answer <span class="hint">- what the student must type</span>', '<input class="adm-input" id="d-answer" placeholder="e.g. photosynthesis">') +
          field('Also accept <span class="hint">(optional - comma-separated variants)</span>', '<input class="adm-input" id="d-accept" placeholder="e.g. photo-synthesis, photosynthesise">') +
          '<p class="adm-note">Answers are checked ignoring case and surrounding spaces.</p>';
      }
      function clozeEditor(){
        return field('Words with missing letters <span class="hint">- put the letters the student must type in [brackets]</span>',
            '<textarea class="adm-textarea" id="d-cloze" placeholder="eleph[ant]   -   or a whole sentence: A migrating bird can nav[igate] by the stars."></textarea>') +
          '<p class="adm-note">The letters <b>before</b> the brackets are shown to the student; the letters <b>inside</b> [ ] are the blank they fill. Example: <code>eleph[ant]</code> → the student sees <b>eleph___</b> and must type <b>ant</b>. Add as many [brackets] as you like.</p>' +
          '<div class="adm-prev" id="d-cloze-prev"><span class="adm-prev-empty">Type above to preview what the student will see…</span></div>';
      }
      // matching: a shared set of options (e.g. A–H) + a list of items, each answered by one option
      function matchingEditor(){
        return field('Options <span class="hint">- what the student picks from (e.g. paragraph letters)</span>',
            '<input class="adm-input" id="d-options" value="A, B, C, D, E, F, G, H">') +
          '<div class="adm-field"><label>Items <span class="hint">- each row: the statement/heading, and the option it matches</span></label>' +
          '<div id="d-items">' + matchRow("") + matchRow("") + matchRow("") + '</div>' +
          '<button type="button" class="adm-btn sec" id="d-additem">+ Add item</button></div>';
      }
      function matchRow(){
        return '<div class="adm-row adm-itemrow">' +
          '<input class="adm-input" data-iprompt placeholder="Statement / heading" style="flex:1">' +
          '<input class="adm-input" data-ianswer placeholder="A" style="width:70px;text-align:center">' +
          '<button type="button" class="adm-x" title="Remove item">✕</button></div>';
      }
      // completion: a list of gapped sentences, each with a typed answer
      function completionEditor(){
        return '<div class="adm-field"><label>Sentences with a gap <span class="hint">- use ______ for the blank; give the answer for each</span></label>' +
          '<div id="d-items">' + compRow() + compRow() + '</div>' +
          '<button type="button" class="adm-btn sec" id="d-additem">+ Add sentence</button>' +
          '<p class="adm-note">Answers are checked ignoring case and spaces. Example - sentence: <code>The movement is called ______.</code> answer: <code>Brownian motion</code>.</p></div>';
      }
      function compRow(){
        return '<div class="adm-row adm-itemrow">' +
          '<input class="adm-input" data-iprompt placeholder="Sentence with a ______ gap" style="flex:1">' +
          '<input class="adm-input" data-ianswer placeholder="answer" style="width:150px">' +
          '<button type="button" class="adm-x" title="Remove">✕</button></div>';
      }

      // ---- passage set: one text + several blocks of different types ----
      var PSET = null;
      function newBlock(kind){
        if (kind === "matching")   return { kind:"matching", prompt:"", options:"A, B, C, D", items:[{prompt:"",answer:""},{prompt:"",answer:""}] };
        if (kind === "completion") return { kind:"completion", prompt:"", items:[{prompt:"",answer:""},{prompt:"",answer:""}] };
        return { kind:"choice", prompt:"", items:[{prompt:"",opts:["","","",""],ans:0}] };
      }
      function passageEditor(){
        return '<div class="adm-field"><label>Question blocks <span class="hint">- one passage, several sets of questions</span></label>' +
          '<div id="d-pset"></div>' +
          '<button type="button" class="adm-btn sec" id="d-addblock">+ Add block</button>' +
          '<p class="adm-note">Paste the whole passage in the “Reading text” box above. Each block is one set of questions (e.g. 14–18 multiple choice, then 19–21 matching, then 22–26 completion). Numbering runs automatically; each block gets its own Check.</p></div>';
      }
      function psetItemRow(kind, it, bi, ii){
        if (kind === "matching")
          return '<div class="adm-row adm-birow"><input class="adm-input" data-ip placeholder="Statement / heading" value="'+esc(it.prompt||"")+'" style="flex:1"><input class="adm-input" data-ia placeholder="A" value="'+esc(it.answer||"")+'" style="width:64px;text-align:center"><button type="button" class="adm-x" data-irm title="Remove">✕</button></div>';
        if (kind === "completion")
          return '<div class="adm-row adm-birow"><input class="adm-input" data-ip placeholder="Sentence with a ______ gap" value="'+esc(it.prompt||"")+'" style="flex:1"><input class="adm-input" data-ia placeholder="answer" value="'+esc(it.answer||"")+'" style="width:150px"><button type="button" class="adm-x" data-irm title="Remove">✕</button></div>';
        var optRows = (it.opts||["","","",""]).map(function(o,oi){
          return '<div class="adm-row"><input type="radio" class="adm-radio" name="mc-'+bi+'-'+ii+'" data-mcans '+(it.ans===oi?"checked":"")+'><input class="adm-input" data-mcopt placeholder="Option '+String.fromCharCode(65+oi)+'" value="'+esc(o||"")+'"></div>';
        }).join("");
        return '<div class="adm-mcq"><input class="adm-input" data-ip placeholder="Question text" value="'+esc(it.prompt||"")+'"><div class="adm-mcopts">'+optRows+'</div><button type="button" class="adm-btn sec" data-irm>✕ Remove question</button></div>';
      }
      function renderPset(){
        var box = document.getElementById("d-pset"); if (!box) return;
        box.innerHTML = PSET.map(function(bl, bi){
          var kinds = [["choice","Multiple choice"],["matching","Matching (letters)"],["completion","Completion (typed)"]];
          var head = '<div class="adm-prow"><select class="adm-select" data-bkind style="max-width:220px">' +
            kinds.map(function(k){ return '<option value="'+k[0]+'"'+(bl.kind===k[0]?" selected":"")+'>'+k[1]+'</option>'; }).join("") +
            '</select><button type="button" class="adm-x" data-brm title="Remove block">✕</button></div>' +
            '<input class="adm-input" data-bprompt placeholder="Instruction (e.g. Questions 14–18 - choose A, B, C or D)" value="'+esc(bl.prompt||"")+'" style="margin-bottom:8px">';
          var body = "";
          if (bl.kind === "matching") body += '<input class="adm-input" data-boptions placeholder="A, B, C, D" value="'+esc(bl.options||"")+'" style="margin-bottom:8px">';
          body += bl.items.map(function(it,ii){ return psetItemRow(bl.kind, it, bi, ii); }).join("");
          body += '<button type="button" class="adm-btn sec" data-iadd>+ Add '+(bl.kind==="choice"?"question":(bl.kind==="matching"?"item":"sentence"))+'</button>';
          return '<div class="adm-pblock" data-block>'+head+body+'</div>';
        }).join("");
        wirePset();
      }
      function syncPset(){
        var box = document.getElementById("d-pset"); if (!box) return;
        PSET = Array.prototype.slice.call(box.querySelectorAll(".adm-pblock")).map(function(bd){
          var kind = bd.querySelector("[data-bkind]").value;
          var prompt = bd.querySelector("[data-bprompt]").value;
          if (kind === "matching"){
            var oel = bd.querySelector("[data-boptions]");
            var items = Array.prototype.slice.call(bd.querySelectorAll(".adm-birow")).map(function(r){ return {prompt:r.querySelector("[data-ip]").value, answer:r.querySelector("[data-ia]").value}; });
            return {kind:kind, prompt:prompt, options:oel?oel.value:"", items:items.length?items:[{prompt:"",answer:""}]};
          } else if (kind === "completion"){
            var items2 = Array.prototype.slice.call(bd.querySelectorAll(".adm-birow")).map(function(r){ return {prompt:r.querySelector("[data-ip]").value, answer:r.querySelector("[data-ia]").value}; });
            return {kind:kind, prompt:prompt, items:items2.length?items2:[{prompt:"",answer:""}]};
          }
          var mcqs = Array.prototype.slice.call(bd.querySelectorAll(".adm-mcq")).map(function(m){
            var opts = Array.prototype.slice.call(m.querySelectorAll("[data-mcopt]")).map(function(o){ return o.value; });
            var radios = Array.prototype.slice.call(m.querySelectorAll("[data-mcans]"));
            var ans = 0; radios.forEach(function(r,i){ if (r.checked) ans = i; });
            return {prompt:m.querySelector("[data-ip]").value, opts:opts, ans:ans};
          });
          return {kind:kind, prompt:prompt, items:mcqs.length?mcqs:[{prompt:"",opts:["","","",""],ans:0}]};
        });
        if (!PSET.length) PSET = [newBlock("choice")];
      }
      function wirePset(){
        var box = document.getElementById("d-pset");
        function blockIndex(node){ return Array.prototype.indexOf.call(box.querySelectorAll(".adm-pblock"), node.parentNode.closest ? node.closest(".adm-pblock") : node); }
        box.querySelectorAll("[data-bkind]").forEach(function(s){ s.onchange = function(){ syncPset(); renderPset(); }; });
        box.querySelectorAll("[data-brm]").forEach(function(b){ b.onclick = function(){ var i = Array.prototype.indexOf.call(box.querySelectorAll(".adm-pblock"), b.closest(".adm-pblock")); syncPset(); PSET.splice(i,1); if (!PSET.length) PSET = [newBlock("choice")]; renderPset(); }; });
        box.querySelectorAll("[data-iadd]").forEach(function(b){ b.onclick = function(){ var i = Array.prototype.indexOf.call(box.querySelectorAll(".adm-pblock"), b.closest(".adm-pblock")); syncPset(); var bl = PSET[i]; bl.items.push(bl.kind==="choice" ? {prompt:"",opts:["","","",""],ans:0} : {prompt:"",answer:""}); renderPset(); }; });
        box.querySelectorAll("[data-irm]").forEach(function(x){ x.onclick = function(){
          var blockNode = x.closest(".adm-pblock");
          var i = Array.prototype.indexOf.call(box.querySelectorAll(".adm-pblock"), blockNode);
          var itemNodes = Array.prototype.slice.call(blockNode.querySelectorAll(".adm-birow, .adm-mcq"));
          var j = itemNodes.indexOf(x.closest(".adm-birow") || x.closest(".adm-mcq"));
          syncPset(); if (PSET[i].items.length > 1) PSET[i].items.splice(j,1); renderPset();
        }; });
      }

      function wireEditor(t){
        if (t.fmt === "passage") {
          PSET = [newBlock("choice")];
          renderPset();
          var addBlock = document.getElementById("d-addblock");
          if (addBlock) addBlock.onclick = function(){ syncPset(); PSET.push(newBlock("choice")); renderPset(); };
          return;
        }
        if (t.fmt === "cloze") {
          var ta = document.getElementById("d-cloze"), prev = document.getElementById("d-cloze-prev");
          if (ta && prev) {
            var upd = function(){
              var pc = parseCloze(ta.value);
              if (!pc.blanks) { prev.innerHTML = '<span class="adm-prev-empty">Wrap letters in [brackets] to preview…</span>'; return; }
              var shown = pc.parts.map(function(p){
                if (p.text != null) return esc(p.text);
                var n = Math.max(3, (p.blank||"").length);
                return esc(p.stem||"") + '<u>' + new Array(n+1).join("_") + '</u>';
              }).join("");
              var answers = pc.parts.filter(function(p){ return p.blank != null; }).map(function(p){ return esc(p.blank); }).join(", ");
              prev.innerHTML = '<div class="adm-prev-line"><b>Student sees:</b> ' + shown + '</div>' +
                               '<div class="adm-prev-line"><b>Correct answer(s):</b> ' + (answers || "-") + '</div>';
            };
            ta.addEventListener("input", upd); upd();
          }
          return;
        }
        if (t.fmt === "matching" || t.fmt === "completion") {
          var mk = (t.fmt === "matching") ? matchRow : compRow;
          var addItem = document.getElementById("d-additem");
          if (addItem) addItem.onclick = function(){ document.getElementById("d-items").insertAdjacentHTML("beforeend", mk()); wireItemX(); };
          wireItemX();
          function wireItemX(){
            document.querySelectorAll("#d-items .adm-x").forEach(function (x){
              x.onclick = function(){
                var c = document.getElementById("d-items");
                if (c.querySelectorAll(".adm-itemrow").length <= 1) return;
                var row = x.parentNode; row.parentNode.removeChild(row);
              };
            });
          }
          return;
        }
        if (t.fmt !== "choice" || t.fixed) return;
        var add = document.getElementById("d-addopt");
        if (add) add.onclick = function(){
          var c = document.getElementById("d-choices");
          if (c.querySelectorAll(".adm-row").length >= 6) return;
          c.insertAdjacentHTML("beforeend", choiceRow("", false, false));
          wireX();
        };
        wireX();
        function wireX(){
          document.querySelectorAll("#d-choices .adm-x").forEach(function (x){
            x.onclick = function(){
              var c = document.getElementById("d-choices");
              if (c.querySelectorAll(".adm-row").length <= 2) return;
              var row = x.parentNode; row.parentNode.removeChild(row);
            };
          });
        }
      }

      /* ---- build + validate a question object per its rules ---- */
      function collect(){
        var t = curType();
        var q = {
          id: "q-" + Date.now().toString(36) + "-" + Math.floor(Math.random()*1e4).toString(36),
          exam: ex, skill: skillSel.value, type: typeSel.value,
          difficulty: document.getElementById("a-diff").value
        };
        if (ex === "ielts" && skillSel.value === "listening") {
          var partEl = document.getElementById("a-part");
          if (partEl) q.part = parseInt(partEl.value, 10);
        }
        if (t.fmt === "cloze") {
          var pc = parseCloze(val("d-cloze"));
          if (!pc.blanks) return err("Wrap the missing letters in [brackets], e.g. eleph[ant].");
          q.parts = pc.parts; q.format = "complete-the-words";
        } else if (t.fmt === "passage") {
          var pp = val("d-prompt"); if (pp) q.prompt = pp;   // top prompt optional - each block has its own
          var tt = val("d-title"); if (tt) q.title = tt;     // shown on the reading-test card
        } else {
          var prompt = val("d-prompt"); if (!prompt) return err("Add a prompt.");
          q.prompt = prompt;
        }
        if (t.fmt === "cloze") { var cp=val("d-prompt"); q.prompt = cp || "Complete the missing letters to finish each word."; }

        if (t.fmt === "passage") {
          if (!val("d-passage")) return err("Paste the passage in the Reading text box above.");
          syncPset();
          var outBlocks = [];
          for (var bi2 = 0; bi2 < PSET.length; bi2++) {
            var bl = PSET[bi2], bp = (bl.prompt || "").trim(), bn = "Block " + (bi2 + 1) + ": ";
            if (bl.kind === "matching") {
              var mopts = (bl.options || "").split(",").map(function (s){ return s.trim(); }).filter(Boolean);
              if (mopts.length < 2) return err(bn + "add options (e.g. A, B, C).");
              var mlo = mopts.map(function (o){ return o.toLowerCase(); }), mits = [];
              for (var a1 = 0; a1 < bl.items.length; a1++) { var i1 = bl.items[a1], p1 = (i1.prompt||"").trim(), an1 = (i1.answer||"").trim();
                if (!p1 && !an1) continue; if (!p1 || !an1) return err(bn + "fill each statement and its letter.");
                if (mlo.indexOf(an1.toLowerCase()) < 0) return err(bn + "answer must be one of " + mopts.join(", ") + ".");
                mits.push({ prompt: p1, answer: an1 }); }
              if (!mits.length) return err(bn + "add at least one item.");
              outBlocks.push({ kind:"matching", prompt: bp, options: mopts, items: mits });
            } else if (bl.kind === "completion") {
              var cits = [];
              for (var a2 = 0; a2 < bl.items.length; a2++) { var i2 = bl.items[a2], p2 = (i2.prompt||"").trim(), an2 = (i2.answer||"").trim();
                if (!p2 && !an2) continue; if (!p2 || !an2) return err(bn + "fill each sentence and its answer."); cits.push({ prompt: p2, answer: an2 }); }
              if (!cits.length) return err(bn + "add at least one sentence.");
              outBlocks.push({ kind:"completion", prompt: bp, items: cits });
            } else {
              var mcs = [];
              for (var a3 = 0; a3 < bl.items.length; a3++) { var i3 = bl.items[a3], p3 = (i3.prompt||"").trim();
                var raw = i3.opts || [], filt = raw.map(function (s){ return (s||"").trim(); }).filter(Boolean);
                if (!p3 && !filt.length) continue;
                if (!p3) return err(bn + "add the question text.");
                if (filt.length < 2) return err(bn + "each question needs at least two options.");
                var chosen = (raw[i3.ans] || "").trim(), ci = filt.indexOf(chosen); if (ci < 0) ci = 0;
                mcs.push({ prompt: p3, choices: filt, answer: ci }); }
              if (!mcs.length) return err(bn + "add at least one question.");
              outBlocks.push({ kind:"choice", prompt: bp, items: mcs });
            }
          }
          if (!outBlocks.length) return err("Add at least one question block.");
          q.format = "passage"; q.blocks = outBlocks;
        } else if (t.fmt === "matching") {
          var options = val("d-options").split(",").map(function (s){ return s.trim(); }).filter(Boolean);
          if (options.length < 2) return err("Add the options (e.g. A, B, C …).");
          var lowerOpts = options.map(function (o){ return o.toLowerCase(); });
          var mitems = [], mbad = false;
          Array.prototype.slice.call(document.querySelectorAll("#d-items .adm-itemrow")).forEach(function (row){
            var pr = (row.querySelector("[data-iprompt]").value || "").trim();
            var an = (row.querySelector("[data-ianswer]").value || "").trim();
            if (!pr && !an) return;
            if (!pr || !an) { mbad = true; return; }
            if (lowerOpts.indexOf(an.toLowerCase()) < 0) { mbad = "opt"; return; }
            mitems.push({ prompt: pr, answer: an });
          });
          if (mbad === "opt") return err("Each answer must be one of the options (" + options.join(", ") + ").");
          if (mbad) return err("Fill both the statement and its answer for each item.");
          if (!mitems.length) return err("Add at least one item.");
          q.format = "matching"; q.options = options; q.items = mitems;
        } else if (t.fmt === "completion") {
          var citems = [], cbad = false;
          Array.prototype.slice.call(document.querySelectorAll("#d-items .adm-itemrow")).forEach(function (row){
            var pr = (row.querySelector("[data-iprompt]").value || "").trim();
            var an = (row.querySelector("[data-ianswer]").value || "").trim();
            if (!pr && !an) return;
            if (!pr || !an) { cbad = true; return; }
            citems.push({ prompt: pr, answer: an });
          });
          if (cbad) return err("Fill both the sentence and its answer for each row.");
          if (!citems.length) return err("Add at least one sentence.");
          q.format = "completion"; q.items = citems;
        } else if (t.fmt === "text") {
          var a = val("d-answer"); if (!a) return err("Enter the correct answer.");
          q.format = "text"; q.answer = a;
          var acc = val("d-accept");
          if (acc) q.accept = acc.split(",").map(function (s){ return s.trim(); }).filter(Boolean);
        } else if (t.fmt === "choice") {
          var choices = [], answerIdx = -1;
          Array.prototype.slice.call(document.querySelectorAll("#d-choices .adm-row")).forEach(function (row){
            var txtEl = row.querySelector("[data-choice]"), rad = row.querySelector("input[type=radio]");
            var txt = (txtEl.value || "").trim(); if (!txt) return;
            if (rad.checked) answerIdx = choices.length;
            choices.push(txt);
          });
          if (choices.length < 2) return err("Add at least two answer options.");
          if (answerIdx < 0) return err("Tick which option is correct.");
          q.choices = choices; q.answer = answerIdx;
        }

        var passage = val("d-passage"); if (passage) q.passage = passage;
        if (typeSel.value === "daily-life") {
          var lk = val("d-letterkind"); if (lk) q.letterKind = lk;
          var lf = val("d-letterfrom"); if (lf) q.letterFrom = lf;
          var ls = val("d-lettersubject"); if (ls) q.letterSubject = ls;
        }
        var tr = val("d-transcript"); if (tr) q.transcript = tr;
        var exp = val("d-exp"); if (exp) q.explanation = exp;
        return q;
      }

    // "nav[igate] ... com[pass]" → parts for the cloze engine
    function parseCloze(str){
      str = String(str || "");
      var parts = [], re = /([^\s\[\]]*)\[([^\]]+)\]/g, last = 0, m, blanks = 0;
      while ((m = re.exec(str))) {
        var before = str.slice(last, m.index);
        if (before) parts.push({ text: before });
        parts.push({ stem: m[1] || "", blank: m[2] });
        blanks++; last = re.lastIndex;
      }
      var tail = str.slice(last); if (tail) parts.push({ text: tail });
      return { parts: parts, blanks: blanks };
    }
    function clozePreview(parts){
      return (parts || []).map(function (p){ return p.text != null ? p.text : (p.stem || "") + (p.blank || ""); }).join("");
    }

            if (!w) return;
            var updated = {}; for (var k in w) updated[k] = w[k];
            updated.status = (w.status === "finished") ? "open" : "finished";
            Promise.resolve(BeaconStore.addWebinar(updated)).then(listWebinars);
          };
        });
      }
    }

    /* =================== mentor requests (home page "book a session" form) =================== */
    function renderMentors(){
      panel.innerHTML =
        '<div class="adm-card">' +
          '<h2 class="adm-h">Mentor requests</h2>' +
          '<p class="adm-sub">Students who asked to book a session from the home page. Message them on Telegram, then delete once handled.</p>' +
          '<div class="adm-msg" id="mm"></div>' +
        '</div>' +
        '<div class="adm-list" id="mlist"></div>';
      var mm = document.getElementById("mm");
      function mmsg(t,k){ mm.className = "adm-msg" + (k ? " " + k : ""); mm.textContent = t || ""; }
      load();
      function load(){
        mmsg("Loading…");
        BeaconStore.listMentorRequests().then(function (res){
          if (!res.ok) return mmsg(res.error || "Could not load.", "bad");
          mmsg("");
          renderList(res.rows);
        });
      }
      function renderList(rows){
        var list = document.getElementById("mlist");
        list.innerHTML = rows.map(function (r){
          var when = r.created_at ? new Date(r.created_at).toLocaleString("en-US", { month:"short", day:"2-digit", hour:"2-digit", minute:"2-digit" }) : "";
          return '<div class="adm-item' + (r.contacted ? " is-contacted" : "") + '"><div class="adm-item-main"><b>' + esc(r.name) + ' · ' + esc(r.exam) + '</b>' +
            '<span>' + esc(r.telegram) + (when ? ' · ' + esc(when) : '') + '</span></div>' +
            '<label class="adm-check"><input type="checkbox" data-id="' + r.id + '"' + (r.contacted ? " checked" : "") + '>Contacted</label>' +
            '<button class="adm-del" data-id="' + r.id + '">Delete</button></div>';
        }).join("") || '<div class="adm-empty">No requests yet.</div>';
        list.querySelectorAll(".adm-check input").forEach(function (cb){
          cb.onchange = function (){
            var item = cb.closest(".adm-item");
            cb.disabled = true;
            BeaconStore.setMentorContacted(Number(cb.dataset.id), cb.checked).then(function (res){
              cb.disabled = false;
              if (!res.ok) { cb.checked = !cb.checked; mmsg(res.error || "Could not update.", "bad"); return; }
              item.classList.toggle("is-contacted", cb.checked);
            });
          };
        });
        list.querySelectorAll(".adm-del").forEach(function (b){
          b.onclick = function (){
            b.disabled = true;
            BeaconStore.deleteMentorRequest(Number(b.dataset.id)).then(function (res){
              if (!res.ok) { b.disabled = false; mmsg(res.error || "Could not delete.", "bad"); return; }
              load();
            });
          };
        });
      }
    }
  });
});
</script>
</body>
</html>
