<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account - Beacon</title>
<link rel="icon" type="image/jpeg" href="assets/beacon-logo-icon.jpg?v=142">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=142">
<script src="assets/app.js?v=142" defer></script>
<script src="assets/config.js?v=142" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/auth.js?v=142" defer></script>
<script src="assets/chat.js?v=142" defer></script>
</head>
<body>
<div class="grain"></div>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand"><span class="logo-mark" role="img" aria-label="Beacon"></span><span class="brand-name">Beacon</span></a>
    <nav class="main-nav"><a href="index.html">Home</a><a href="toefl.html">TOEFL</a><a href="ielts.html">IELTS</a><a href="sat.html">SAT</a><a href="webinars.html">Webinars</a></nav>
    <div class="header-actions">
      <a href="auth.html?view=login" class="link-quiet">Log in</a>
      <a href="auth.html?view=register" class="btn btn-gold">Start free</a>
    </div>
  </div>
</header>

<main>
  <div class="wrap" style="max-width:820px;padding-bottom:60px">
    <div class="page-head" style="padding-bottom:0"><h1 id="acct-title">Your account</h1></div>
    <nav class="tabs" id="tabs">
      <a href="account.html?tab=profile" data-tab="profile">Profile</a>
      <a href="account.html?tab=favorites" data-tab="favorites">Saved</a>
    </nav>
    <div id="panel"></div>
  </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
  BeaconAuth.requireAuth().then(function (user) {
  if (!user) return;
  function qs(n){var m=new RegExp("[?&]"+n+"=([^&]*)").exec(location.search);return m?decodeURIComponent(m[1]):null;}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  var tab = qs("tab") || "profile";
  var panel = document.getElementById("panel");
  document.querySelectorAll("#tabs a").forEach(function (a) { if (a.dataset.tab === tab) a.classList.add("active"); });

  BeaconStore.ready().then(function () {
    if (tab === "favorites") renderFavorites();
    else if (tab === "progress") renderProgress();
    else renderProfile();
  });

  var EX = { toefl:{name:"TOEFL", scale:"/120", ph:"target /120, e.g. 100"},
             ielts:{name:"IELTS", scale:"band", ph:"target band, e.g. 7.0"},
             sat:{name:"SAT", scale:"/1600", ph:"target /1600, e.g. 1400"} };
  var EXAM_ORDER = ["toefl","ielts","sat"];
  var AVATARS = ['fox','panda','cat','bear','penguin','rabbit','frog','koala','tiger','pig','owl','dog'];
  function fmtScore(exam, v){ if (v==null) return "-"; return exam==="ielts" ? Number(v).toFixed(1) : String(Math.round(v)); }

  function renderProfile() {
    var goals = BeaconStore.getGoals ? BeaconStore.getGoals() : {};
    var order = EXAM_ORDER;
    var examOptions = order.map(function(e){ return '<option value="'+e+'">'+EX[e].name+'</option>'; }).join("");
    var defaultGoalExam = order.filter(function(e){ return goals[e]; })[0] || order[0];
    var defaultResultExam = order.filter(function(e){ return (BeaconStore.scoreHistory ? BeaconStore.scoreHistory(e) : []).length; })[0] || order[0];

    var goalsCard =
      '<div class="card"><div class="sec-head">' +
      '<h2 style="font-size:1.35rem">Your exams <span class="amp">&amp;</span> goals</h2>' +
      '<select class="exam-select" id="goal-exam-sel">' + examOptions + '</select></div>' +
      '<div id="goal-body"></div></div>';

    // results history, per exam - pick an exam, see its attempts newest first, so
    // progress is readable without three exams' worth of rows stacked at once.
    var resultsCard =
      '<div class="card"><div class="sec-head">' +
      '<h2 style="font-size:1.35rem">Your results</h2>' +
      '<select class="exam-select" id="res-exam-sel">' + examOptions + '</select></div>' +
      '<p class="sub" style="margin-bottom:6px">Every full test you’ve completed - most recent first.</p>' +
      '<div id="res-body"></div></div>';

    panel.innerHTML =
      '<div class="card">' +
      '<h1>' + esc(user.name) + '</h1>' +
      '<p class="sub" style="color:#4a5875">' + esc(user.email) + (user.role === "admin" ? ' · admin' : ' · student') + '</p>' +
      (user.role !== "admin" ?
        '<div class="data-row" style="margin-bottom:14px"><div class="rl-main"><b>Nickname</b><span>Shown in the community chat.</span></div>' +
          '<input id="nick-input" maxlength="20" placeholder="your nickname" autocomplete="off" ' +
          'style="width:180px;max-width:52%;background:#f2f5fa;border:1px solid #dbe1ec;border-radius:9px;padding:8px 11px;color:#14233f;font-family:var(--mono);font-size:.85rem"></div>' +
        '<div class="data-row" style="margin-bottom:14px"><div class="rl-main"><b>Avatar</b><span>Pick a picture shown next to your messages.</span></div>' +
          '<img id="av-current" alt="" style="width:38px;height:38px;border-radius:9px;object-fit:cover" src="assets/avatars/_default.svg"></div>' +
        '<div id="av-grid" style="display:flex;flex-wrap:wrap;gap:8px"></div>' +
        '<button class="btn btn-gold full" id="save-prof" style="margin-top:22px">Save changes</button>' +
        '<p id="save-msg" style="text-align:center;font-size:.85rem;margin:8px 0 0;min-height:1.1em"></p>'
        : '') +
      (user.role === "admin" ? '<a href="admin.html" class="btn btn-ghost full" style="margin-top:16px">Open admin panel</a>' : '') +
      '</div>' + goalsCard + resultsCard +
      '<button class="btn btn-ghost full" id="lo">Log out</button>';

    document.getElementById("lo").onclick = function () { BeaconAuth.logout(); };
    loadProfileEditor();

    var goalSel = document.getElementById("goal-exam-sel");
    goalSel.value = defaultGoalExam;
    goalSel.onchange = function(){ renderGoalBody(goals, goalSel.value); };
    renderGoalBody(goals, defaultGoalExam);

    var resSel = document.getElementById("res-exam-sel");
    resSel.value = defaultResultExam;
    resSel.onchange = function(){ renderResultsBody(resSel.value); };
    renderResultsBody(defaultResultExam);
  }

  function renderGoalBody(goals, exam) {
    var box = document.getElementById("goal-body");
    if (!box) return;
    var t = goals[exam] && goals[exam].target;
    var a = BeaconStore.avgScore ? BeaconStore.avgScore(exam) : null;
    var avgTxt = a ? (fmtScore(exam,a.avg)+" "+EX[exam].scale+" · avg of "+a.count+" test"+(a.count>1?"s":"")) : "no full tests yet";
    box.innerHTML =
      '<div class="data-row"><div class="rl-main"><b>'+EX[exam].name+'</b><span>'+
      (t!=null ? "target "+fmtScore(exam,t)+" "+EX[exam].scale : "no target set")+'</span></div>'+
      '<span class="rl-num" style="font-size:.95rem;font-weight:600">'+esc(avgTxt)+'</span>'+
      '<button class="icon-btn go" id="edit-goal-btn">Edit</button></div>' +
      '<div id="goal-editor"></div>';
    document.getElementById("edit-goal-btn").onclick = function(){ editSingleGoal(goals, exam); };
  }

  function renderResultsBody(exam) {
    var box = document.getElementById("res-body");
    if (!box) return;
    var hist = BeaconStore.scoreHistory ? BeaconStore.scoreHistory(exam) : [];
    if (!hist.length) {
      box.innerHTML = '<p class="sub">No full '+esc(EX[exam].name)+' tests completed yet - finish a full test (not just skill practice) and it’ll show up here.</p>';
      return;
    }
    var rows = hist.map(function(h){
      var dateStr = new Date(h.at).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
      var detail = (exam === "sat" && (h.rw != null || h.math != null))
        ? "R<span class=\"amp\">&amp;</span>W " + (h.rw!=null?fmtScore("sat",h.rw):"-") + " · Math " + (h.math!=null?fmtScore("sat",h.math):"-")
        : "";
      return '<div class="data-row"><div class="rl-main"><b>'+esc(dateStr)+'</b>'+
        (detail ? '<span>'+detail+'</span>' : '')+'</div>'+
        '<span class="rl-num" style="font-size:1.05rem;font-weight:700;color:#14233f">'+esc(fmtScore(exam,h.score))+' '+EX[exam].scale+'</span></div>';
    }).join("");
    box.innerHTML = '<div class="row-list">' + rows + '</div>';
  }

  // combined nickname + avatar editor: pick/type, then one "Save changes" button persists both
  function loadProfileEditor() {
    if (user.role === "admin" || !window.sb) return;
    var grid = document.getElementById("av-grid");
    var input = document.getElementById("nick-input");
    var saveBtn = document.getElementById("save-prof");
    var msg = document.getElementById("save-msg");
    if (!grid || !input || !saveBtn) return;
    var selected = "";
    function setMsg(t, ok){ if (msg){ msg.textContent = t || ""; msg.style.color = ok ? "#1f9d63" : "#c23b3b"; } }
    function paintGrid() {
      grid.innerHTML = AVATARS.map(function(a){
        var on = a === selected;
        return '<button type="button" class="av-opt'+(on?" on":"")+'" data-av="'+a+'" '+
          'style="width:46px;height:46px;padding:3px;border-radius:12px;cursor:pointer;'+
          'border:2px solid '+(on?"#d4a72c":"#dbe1ec")+';background:'+(on?"rgba(212,167,44,.12)":"#f2f5fa")+'">'+
          '<img alt="'+a+'" src="assets/avatars/'+a+'.svg" style="width:100%;height:100%;border-radius:8px;object-fit:cover;display:block"></button>';
      }).join("");
      var cur = document.getElementById("av-current"); if (cur) cur.src = "assets/avatars/" + (selected || "_default") + ".svg";
      grid.querySelectorAll(".av-opt").forEach(function(b){
        b.onclick = function(){ selected = b.dataset.av; setMsg("", true); paintGrid(); };
      });
    }
    input.addEventListener("input", function(){ setMsg("", true); });
    // load current nickname + avatar into the form
    sb.from("profiles").select("nickname, avatar").eq("user_id", user.id).maybeSingle().then(function(r){
      var nick = (r && r.data && r.data.nickname) || "";
      selected = (r && r.data && r.data.avatar) || "";
      if (nick) { input.value = nick; paintGrid(); return; }
      return sb.auth.getUser().then(function(g){
        var mn = g && g.data && g.data.user && g.data.user.user_metadata && g.data.user.user_metadata.nickname;
        if (mn) input.value = String(mn).trim();
        paintGrid();
      });
    }).catch(paintGrid);
    // save nickname + avatar together
    saveBtn.onclick = function(){
      var v = (input.value || "").trim().replace(/\s+/g,"_").replace(/[^A-Za-z0-9_.\-]/g,"").slice(0,20);
      if (v.length < 3) { setMsg("Nickname needs at least 3 characters.", false); return; }
      input.value = v;
      var payload = { user_id: user.id, nickname: v };
      if (selected) payload.avatar = selected;
      saveBtn.disabled = true; setMsg("Saving…", true);
      sb.from("profiles").upsert(payload, { onConflict: "user_id" }).then(function(r){
        saveBtn.disabled = false;
        if (r.error) { setMsg(/duplicate|unique/i.test(r.error.message) ? "That nickname is taken - try another." : r.error.message, false); return; }
        setMsg("Saved ✓", true);
        if (window.BeaconChat) {
          if (BeaconChat.setNick) BeaconChat.setNick(v);
          if (selected && BeaconChat.setAvatar) BeaconChat.setAvatar(selected);
        }
        if (selected) document.querySelectorAll(".acct-av").forEach(function(img){ img.src = "assets/avatars/" + selected + ".svg"; });
      });
    };
  }

  function editSingleGoal(goals, exam) {
    var box = document.getElementById("goal-editor");
    if (!box) return;
    var on = !!goals[exam]; var t = goals[exam] && goals[exam].target;
    box.innerHTML =
      '<div style="border-top:1px solid #e3e7f0;margin-top:12px;padding-top:14px">' +
      '<div class="goal-row"><label class="goal-check"><input type="checkbox" id="sg-on"'+(on?" checked":"")+'> Track '+EX[exam].name+'</label>'+
      '<input class="goal-target" id="sg-target" inputmode="decimal" placeholder="'+EX[exam].ph+'" value="'+(t!=null?esc(t):"")+'"></div>' +
      '<button class="btn btn-gold full" id="save-goal" style="margin-top:10px">Save</button></div>';
    document.getElementById("save-goal").onclick = function(){
      var checked = document.getElementById("sg-on").checked;
      var v = parseFloat(document.getElementById("sg-target").value);
      if (checked) goals[exam] = isNaN(v) ? {} : { target: v }; else delete goals[exam];
      BeaconStore.setGoals(goals);
      renderGoalBody(goals, exam);
    };
  }

  function renderFavorites() {
    var favs = BeaconStore.favoriteQuestions();
    var examOptions = EXAM_ORDER.map(function(e){ return '<option value="'+e+'">'+EX[e].name+'</option>'; }).join("");
    var defaultExam = EXAM_ORDER.filter(function(e){ return favs.some(function(q){ return q.exam === e; }); })[0] || EXAM_ORDER[0];

    panel.innerHTML =
      '<div class="card"><div class="sec-head"><h2 style="font-size:1.35rem">Saved questions</h2>' +
      '<select class="exam-select" id="fav-exam-sel">' + examOptions + '</select></div>' +
      '<div id="fav-body"></div></div>';

    var sel = document.getElementById("fav-exam-sel");
    sel.value = defaultExam;
    sel.onchange = function(){ renderFavBody(favs, sel.value); };
    renderFavBody(favs, defaultExam);
  }

  function renderFavBody(favs, exam) {
    var box = document.getElementById("fav-body");
    if (!box) return;
    var filtered = favs.filter(function(q){ return q.exam === exam; });
    if (!filtered.length) {
      box.innerHTML = '<p class="sub">No saved '+esc(EX[exam].name)+' questions yet - tap “Save” on a question during practice to add one here.</p>';
      return;
    }
    var rows = filtered.map(function (q) {
      return '<div class="data-row fav-row" data-href="practice.html?one=' + esc(q.id) + '"><div class="rl-main"><b>' + esc(shorten(q.prompt)) + '</b>' +
        '<span>' + esc(q.skill) + ' · ' + esc((q.type||"").replace(/-/g," ")) + '</span></div>' +
        '<button class="icon-btn" data-id="' + esc(q.id) + '">Remove</button></div>';
    }).join("");
    box.innerHTML = '<a class="btn btn-gold full" href="practice.html?fav=1&exam=' + esc(exam) + '" style="margin-bottom:16px">Practice saved (' + filtered.length + ')</a>' +
      '<div class="row-list">' + rows + '</div>';
    box.querySelectorAll(".fav-row").forEach(function (row) {
      row.onclick = function (e) { if (!e.target.closest(".icon-btn")) location.href = row.dataset.href; };
    });
    box.querySelectorAll("button.icon-btn").forEach(function (b) {
      b.onclick = function (e) { e.stopPropagation(); BeaconStore.toggleFav(b.dataset.id); renderFavorites(); };
    });
  }

  function renderProgress() {
    var qsList = BeaconStore.allQuestions();
    var buckets = {};
    qsList.forEach(function (q) {
      var key = q.exam + "|" + q.skill + "|" + q.type;
      if (!buckets[key]) buckets[key] = { exam:q.exam, skill:q.skill, type:q.type };
    });
    var byExam = {};
    Object.keys(buckets).forEach(function (k) {
      var b = buckets[k]; (byExam[b.exam] = byExam[b.exam] || []).push(b);
    });
    var exams = Object.keys(byExam);
    if (!exams.length) { panel.innerHTML = '<div class="empty-state">No questions available yet.</div>'; return; }
    var html = "";
    exams.forEach(function (ex) {
      html += '<div class="group-title">' + esc(ex) + '</div><div class="row-list">';
      byExam[ex].forEach(function (b) {
        var c = BeaconStore.counts(b.exam, b.skill, b.type);
        var pct = c.total ? Math.round(c.solved / c.total * 100) : 0;
        html += '<div class="data-row"><div class="rl-main"><b>' + esc((b.type||"").replace(/-/g," ")) + '</b>' +
          '<span>' + esc(b.skill) + '</span></div>' +
          '<span class="rl-num">' + c.solved + '/' + c.total + '</span>' +
          '<span class="mini-track"><span class="mini-fill" style="width:' + pct + '%"></span></span></div>';
      });
      html += '</div>';
    });
    panel.innerHTML = html;
  }

  function shorten(s){ s=String(s||""); return s.length>78 ? s.slice(0,78)+"…" : s; }
  });
});
</script>
</body>
</html>
