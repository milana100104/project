<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account — Beacon</title>
<link rel="icon" type="image/jpeg" href="assets/beacon-logo-icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=41">
<script src="assets/app.js?v=41" defer></script>
<script src="assets/config.js?v=41" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/auth.js?v=41" defer></script>
<script src="assets/chat.js?v=41" defer></script>
</head>
<body>
<div class="grain"></div>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand"><span class="logo-mark" role="img" aria-label="Beacon"></span><span class="brand-name">Beacon</span></a>
    <nav class="main-nav"><a href="index.html">Home</a><a href="toefl.html">TOEFL</a><a href="ielts.html">IELTS</a><a href="sat.html">SAT</a><a href="webinars.html">Webinars</a></nav>
    <div class="header-actions">
      <a href="auth.html?view=login" class="link-quiet">Log in</a>
      <a href="auth.html?view=register" class="btn btn-gold">Start free</a>
    </div>
  </div>
</header>

<main>
  <div class="wrap" style="max-width:820px;padding-bottom:60px">
    <div class="page-head" style="padding-bottom:0"><h1 id="acct-title">Your account</h1></div>
    <nav class="tabs" id="tabs">
      <a href="account.html?tab=profile" data-tab="profile">Profile</a>
      <a href="account.html?tab=favorites" data-tab="favorites">Saved</a>
    </nav>
    <div id="panel"></div>
  </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
  BeaconAuth.requireAuth().then(function (user) {
  if (!user) return;
  function qs(n){var m=new RegExp("[?&]"+n+"=([^&]*)").exec(location.search);return m?decodeURIComponent(m[1]):null;}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  var tab = qs("tab") || "profile";
  var panel = document.getElementById("panel");
  document.querySelectorAll("#tabs a").forEach(function (a) { if (a.dataset.tab === tab) a.classList.add("active"); });

  BeaconStore.ready().then(function () {
    if (tab === "favorites") renderFavorites();
    else if (tab === "progress") renderProgress();
    else renderProfile();
  });

  var EX = { toefl:{name:"TOEFL", scale:"/120", ph:"target /120, e.g. 100"},
             ielts:{name:"IELTS", scale:"band", ph:"target band, e.g. 7.0"},
             sat:{name:"SAT", scale:"/1600", ph:"target /1600, e.g. 1400"} };
  var AVATARS = ['🦊','🐼','🦁','🐯','🐸','🐵','🐧','🦉','🐙','🦄','🐷','🐨','🐰','🐺','🐢'];
  function fmtScore(exam, v){ if (v==null) return "—"; return exam==="ielts" ? Number(v).toFixed(1) : String(Math.round(v)); }

  function renderProfile() {
    var goals = BeaconStore.getGoals ? BeaconStore.getGoals() : {};
    var order = ["toefl","ielts","sat"];
    var goalRows = order.filter(function(e){return goals[e];}).map(function(e){
      var t = goals[e] && goals[e].target;
      var a = BeaconStore.avgScore ? BeaconStore.avgScore(e) : null;
      var avgTxt = a ? (fmtScore(e,a.avg)+" "+EX[e].scale+" · avg of "+a.count+" test"+(a.count>1?"s":"")) : "no full tests yet";
      return '<div class="data-row"><div class="rl-main"><b>'+EX[e].name+'</b><span>'+
        (t!=null ? "target "+fmtScore(e,t)+" "+EX[e].scale : "no target set")+'</span></div>'+
        '<span class="rl-num" style="font-size:.95rem;font-weight:600">'+esc(avgTxt)+'</span></div>';
    }).join("");

    var goalsCard = (user.role === "admin") ? "" :
      '<div class="card" style="margin-top:16px;margin-bottom:48px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px">' +
      '<h2 style="font-size:1.1rem">Your exams &amp; goals</h2><button class="icon-btn go" id="edit-goals">Edit</button></div>' +
      (goalRows || '<p class="sub">No exams chosen yet — tap Edit to pick what you’re preparing for and set a target.</p>') +
      '<div id="goals-editor"></div></div>';

    panel.innerHTML =
      '<div class="card">' +
      '<h1 style="color:var(--gold)">' + esc(user.name) + '</h1>' +
      '<p class="sub">' + esc(user.email) + (user.role === "admin" ? ' · admin' : ' · student') + '</p>' +
      '<div class="data-row"><div class="rl-main"><b>Saved</b><span>Questions you saved to redo.</span></div>' +
        '<span class="rl-num">' + BeaconStore.favCount() + '</span></div>' +
      (user.role !== "admin" ? '<div class="data-row"><div class="rl-main"><b>Nickname</b><span>Shown in the community chat.</span></div>' +
        '<span class="rl-num" id="nick-val" style="font-size:.95rem;font-weight:600">…</span>' +
        '<button class="icon-btn go" id="chg-nick">Change</button></div>' +
        '<div class="data-row"><div class="rl-main"><b>Avatar</b><span>Pick an icon shown next to your messages.</span></div>' +
        '<span class="rl-num" id="av-current" style="font-size:1.4rem">🙂</span></div>' +
        '<div id="av-grid" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"></div>' : '') +
      (user.role === "admin" ? '<a href="admin.html" class="btn btn-ghost full" style="margin-top:16px">Open admin panel</a>' : '') +
      '<button class="btn btn-gold full" id="lo" style="margin-top:12px">Log out</button>' +
      '</div>' + goalsCard;

    document.getElementById("lo").onclick = function () { BeaconAuth.logout(); };
    loadNick();
    loadAvatar();
    var cn = document.getElementById("chg-nick"); if (cn) cn.onclick = changeNick;
    var eg = document.getElementById("edit-goals");
    if (eg) eg.onclick = function(){ editGoals(goals); };
  }

  function loadNick() {
    if (user.role === "admin" || !window.sb) return;
    sb.from("profiles").select("nickname").eq("user_id", user.id).maybeSingle().then(function(r){
      var el = document.getElementById("nick-val"); if (!el) return;
      el.textContent = (r && r.data && r.data.nickname) ? "@"+r.data.nickname : "not set";
    }).catch(function(){});
  }
  function loadAvatar() {
    var grid = document.getElementById("av-grid"); if (!grid || !window.sb) return;
    var current = "";
    function paint() {
      grid.innerHTML = AVATARS.map(function(a){
        var on = a === current;
        return '<button class="av-opt'+(on?" on":"")+'" data-av="'+a+'" '+
          'style="font-size:1.4rem;width:44px;height:44px;border-radius:11px;cursor:pointer;'+
          'border:2px solid '+(on?"var(--gold-line)":"var(--border)")+';background:'+(on?"var(--gold-soft)":"var(--bg-2)")+'">'+a+'</button>';
      }).join("");
      var cur = document.getElementById("av-current"); if (cur) cur.textContent = current || "🙂";
      grid.querySelectorAll(".av-opt").forEach(function(b){
        b.onclick = function(){
          var a = b.dataset.av;
          sb.from("profiles").upsert({ user_id: user.id, avatar: a }, { onConflict: "user_id" }).then(function(r){
            if (r.error) { alert(r.error.message); return; }
            current = a; paint();
            if (window.BeaconChat && BeaconChat.setAvatar) BeaconChat.setAvatar(a);
          });
        };
      });
    }
    sb.from("profiles").select("avatar").eq("user_id", user.id).maybeSingle().then(function(r){
      current = (r && r.data && r.data.avatar) || "";
      paint();
    }).catch(paint);
  }

  function changeNick() {
    if (!window.sb) return;
    var v = prompt("Pick a nickname (unique, 3–20 characters):"); if (!v) return;
    v = v.trim();
    if (v.length < 3) { alert("Nickname needs at least 3 characters."); return; }
    sb.from("profiles").upsert({ user_id: user.id, nickname: v }, { onConflict: "user_id" }).then(function(r){
      if (r.error) { alert(/duplicate|unique/i.test(r.error.message) ? "That nickname is taken — try another." : r.error.message); return; }
      loadNick();
      if (window.BeaconChat && BeaconChat.setNick) BeaconChat.setNick(v);
    });
  }

  function editGoals(goals) {
    var box = document.getElementById("goals-editor");
    if (!box) return;
    var order = ["toefl","ielts","sat"];
    box.innerHTML =
      '<div style="border-top:1px solid var(--border);margin-top:12px;padding-top:14px">' +
      order.map(function(e){
        var on = !!goals[e]; var t = goals[e] && goals[e].target;
        return '<div class="goal-row"><label class="goal-check"><input type="checkbox" id="g-'+e+'"'+(on?" checked":"")+'> '+EX[e].name+'</label>'+
          '<input class="goal-target" id="gt-'+e+'" inputmode="decimal" placeholder="'+EX[e].ph+'" value="'+(t!=null?esc(t):"")+'"></div>';
      }).join("") +
      '<button class="btn btn-gold full" id="save-goals" style="margin-top:10px">Save goals</button></div>';
    document.getElementById("save-goals").onclick = function(){
      var out={}; order.forEach(function(e){
        if (document.getElementById("g-"+e).checked){ var v=parseFloat(document.getElementById("gt-"+e).value); out[e]=isNaN(v)?{}:{target:v}; }
      });
      BeaconStore.setGoals(out);
      renderProfile();
    };
  }

  function renderFavorites() {
    var favs = BeaconStore.favoriteQuestions();
    if (!favs.length) {
      panel.innerHTML = '<div class="empty-state">Nothing saved yet.<span class="hand-note">tap “Save” on a question during practice to redo it later &#8599;</span></div>';
      return;
    }
    var rows = favs.map(function (q) {
      return '<div class="data-row"><div class="rl-main"><b>' + esc(shorten(q.prompt)) + '</b>' +
        '<span>' + esc(q.exam) + ' · ' + esc(q.skill) + ' · ' + esc((q.type||"").replace(/-/g," ")) + '</span></div>' +
        (q.difficulty ? '<span class="pill-diff">' + esc(q.difficulty) + '</span>' : '') +
        '<a class="icon-btn go" href="practice.html?one=' + esc(q.id) + '">Redo &#8594;</a>' +
        '<button class="icon-btn" data-id="' + esc(q.id) + '">Remove</button></div>';
    }).join("");
    panel.innerHTML =
      '<a class="btn btn-gold" href="practice.html?fav=1" style="margin-bottom:16px">Practice saved (' + favs.length + ')</a>' +
      '<div class="row-list">' + rows + '</div>';
    panel.querySelectorAll("button.icon-btn").forEach(function (b) {
      b.onclick = function () { BeaconStore.toggleFav(b.dataset.id); renderFavorites(); };
    });
  }

  function renderProgress() {
    var qsList = BeaconStore.allQuestions();
    var buckets = {};
    qsList.forEach(function (q) {
      var key = q.exam + "|" + q.skill + "|" + q.type;
      if (!buckets[key]) buckets[key] = { exam:q.exam, skill:q.skill, type:q.type };
    });
    var byExam = {};
    Object.keys(buckets).forEach(function (k) {
      var b = buckets[k]; (byExam[b.exam] = byExam[b.exam] || []).push(b);
    });
    var exams = Object.keys(byExam);
    if (!exams.length) { panel.innerHTML = '<div class="empty-state">No questions available yet.</div>'; return; }
    var html = "";
    exams.forEach(function (ex) {
      html += '<div class="group-title">' + esc(ex) + '</div><div class="row-list">';
      byExam[ex].forEach(function (b) {
        var c = BeaconStore.counts(b.exam, b.skill, b.type);
        var pct = c.total ? Math.round(c.solved / c.total * 100) : 0;
        html += '<div class="data-row"><div class="rl-main"><b>' + esc((b.type||"").replace(/-/g," ")) + '</b>' +
          '<span>' + esc(b.skill) + '</span></div>' +
          '<span class="rl-num">' + c.solved + '/' + c.total + '</span>' +
          '<span class="mini-track"><span class="mini-fill" style="width:' + pct + '%"></span></span></div>';
      });
      html += '</div>';
    });
    panel.innerHTML = html;
  }

  function shorten(s){ s=String(s||""); return s.length>78 ? s.slice(0,78)+"…" : s; }
  });
});
</script>
</body>
</html>
